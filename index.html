<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snake Pro</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background: linear-gradient(
        145deg,
        #071a12,
        #102d1d
    );

    color: white;
}


/* MAIN GAME */

.game {
    width: 95%;
    max-width: 600px;

    padding: 22px;

    background: rgba(0, 0, 0, 0.35);

    border: 1px solid #285c3e;

    border-radius: 25px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.35);
}


/* TITLE */

.title {
    color: #39ff88;

    font-size: 38px;

    font-weight: 900;

    letter-spacing: 2px;

    text-shadow:
        0 0 12px #39ff88;
}

.edition {
    color: #9bb8a5;

    font-size: 12px;

    margin-top: 3px;
}


/* TOP INFORMATION */

.top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 18px;
}

.level-info {
    text-align: right;

    color: #b8d8c5;

    font-size: 14px;
}


/* SCORE */

.score-board {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-bottom: 15px;
}

.stat {
    background: #0b2418;

    border: 1px solid #285c3e;

    border-radius: 12px;

    padding: 10px;

    text-align: center;
}

.stat-title {
    font-size: 11px;

    color: #9bb8a5;

    margin-bottom: 4px;
}

.stat-value {
    color: #39ff88;

    font-size: 18px;

    font-weight: bold;
}


/* GAME BOARD */

#gameBoard {

    display: grid;

    grid-template-columns:
        repeat(24, 1fr);

    width: 100%;

    aspect-ratio: 1;

    background: #041009;

    border: 3px solid #39ff88;

    border-radius: 14px;

    overflow: hidden;

    box-shadow:
        inset 0 0 30px
        rgba(57,255,136,0.12),

        0 0 20px
        rgba(57,255,136,0.12);
}


/* CELLS */

.cell {

    min-width: 0;

    min-height: 0;

    border:
        1px solid
        rgba(255,255,255,0.018);
}


/* SNAKE */

.snake {

    background: #39ff88;

    border-radius: 5px;

    box-shadow:
        0 0 9px #39ff88;
}


/* HEAD */

.head {

    background: #c2ffda;

    border-radius: 7px;

    box-shadow:
        0 0 14px #39ff88;
}


/* NORMAL FOOD */

.food {

    background: #ff4057;

    border-radius: 50%;

    transform: scale(0.62);

    box-shadow:
        0 0 16px #ff4057;
}


/* BONUS FOOD */

.bonus {

    background: #ffd84a;

    border-radius: 50%;

    transform: scale(0.5);

    box-shadow:
        0 0 18px #ffd84a;
}


/* BUTTONS */

.buttons {

    display: flex;

    justify-content: center;

    gap: 10px;

    margin-top: 18px;

    flex-wrap: wrap;
}

button {

    cursor: pointer;

    font-size: 15px;

    font-weight: bold;

    border-radius: 11px;

    padding: 11px 20px;
}


/* START */

#startButton {

    border: none;

    background: #39ff88;

    color: #06140d;
}

#startButton:hover {

    background: #a7ffc7;
}


/* PAUSE */

#pauseButton {

    background: #0b2418;

    color: white;

    border: 1px solid #285c3e;
}

#pauseButton:hover {

    background: #123923;
}


/* MOBILE CONTROLS */

.controls {

    display: grid;

    grid-template-columns:
        repeat(3, 52px);

    gap: 7px;

    justify-content: center;

    margin-top: 17px;
}

.controls button {

    width: 52px;

    height: 46px;

    padding: 0;

    color: white;

    background: #123923;

    border: 1px solid #39ff88;

    font-size: 19px;
}

.controls button:hover {

    background: #286f46;
}

.up {

    grid-column: 2;
}

.left {

    grid-column: 1;
}

.down {

    grid-column: 2;
}

.right {

    grid-column: 3;
}


/* MESSAGE */

#message {

    text-align: center;

    color: #b8d8c5;

    font-size: 14px;

    margin-top: 15px;

    min-height: 20px;
}


/* MOBILE */

@media(max-width:430px) {

    .game {

        padding: 14px;
    }

    .title {

        font-size: 30px;
    }

    .stat {

        padding: 8px 5px;
    }

}

</style>
</head>


<body>


<div class="game">


    <!-- TITLE -->

    <div class="top">

        <div>

            <div class="title">
                SNAKE PRO
            </div>

            <div class="edition">
                ARCADE EDITION
            </div>

        </div>


        <div class="level-info">

            Level
            <b id="level">1</b>

            <br>

            Speed
            <b id="speed">1.0x</b>

        </div>

    </div>


    <!-- SCORE -->

    <div class="score-board">


        <div class="stat">

            <div class="stat-title">
                SCORE
            </div>

            <div
                class="stat-value"
                id="score"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                BEST
            </div>

            <div
                class="stat-value"
                id="best"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                LIVES
            </div>

            <div
                class="stat-value"
                id="lives"
            >
                ❤️❤️❤️
            </div>

        </div>


    </div>


    <!-- GAME BOARD -->

    <div id="gameBoard"></div>


    <!-- ACTION BUTTONS -->

    <div class="buttons">

        <button id="startButton">
            START GAME
        </button>

        <button id="pauseButton">
            PAUSE
        </button>

    </div>


    <!-- MOBILE CONTROLS -->

    <div class="controls">

        <button
            class="up"
            data-direction="up"
        >
            ▲
        </button>


        <button
            class="left"
            data-direction="left"
        >
            ◀
        </button>


        <button
            class="down"
            data-direction="down"
        >
            ▼
        </button>


        <button
            class="right"
            data-direction="right"
        >
            ▶
        </button>

    </div>


    <div id="message">
        Press START GAME to begin
    </div>


</div>



<script>


/* =========================
   GAME VARIABLES
========================= */

const gameBoard =
    document.getElementById("gameBoard");

const scoreDisplay =
    document.getElementById("score");

const bestDisplay =
    document.getElementById("best");

const livesDisplay =
    document.getElementById("lives");

const levelDisplay =
    document.getElementById("level");

const speedDisplay =
    document.getElementById("speed");

const message =
    document.getElementById("message");

const startButton =
    document.getElementById("startButton");

const pauseButton =
    document.getElementById("pauseButton");


const boardSize = 24;


let snake;

let food;

let bonusFood = null;

let direction;

let nextDirection;

let score = 0;

let bestScore = 0;

let lives = 3;

let level = 1;

let gameTimer;

let gameRunning = false;

let gamePaused = false;



/* =========================
   CREATE BOARD
========================= */

function createBoard() {

    gameBoard.innerHTML = "";

    for (
        let i = 0;
        i < boardSize * boardSize;
        i++
    ) {

        const cell =
            document.createElement("div");

        cell.classList.add("cell");

        gameBoard.appendChild(cell);
    }
}



/* =========================
   CREATE FOOD
========================= */

function createFood() {

    let newFood;

    do {

        newFood = {

            x:
                Math.floor(
                    Math.random() * boardSize
                ),

            y:
                Math.floor(
                    Math.random() * boardSize
                )
        };

    }

    while (

        snake.some(

            part =>
                part.x === newFood.x &&
                part.y === newFood.y

        )

    );

    return newFood;
}



/* =========================
   START GAME
========================= */

function startGame() {

    clearInterval(gameTimer);


    snake = [

        { x: 12, y: 12 },

        { x: 11, y: 12 },

        { x: 10, y: 12 }

    ];


    direction = {
        x: 1,
        y: 0
    };


    nextDirection = {
        x: 1,
        y: 0
    };


    score = 0;

    lives = 3;

    level = 1;

    bonusFood = null;


    food = createFood();


    gameRunning = true;

    gamePaused = false;


    scoreDisplay.textContent = score;

    levelDisplay.textContent = level;

    livesDisplay.textContent =
        "❤️❤️❤️";


    startButton.textContent =
        "RESTART";


    pauseButton.textContent =
        "PAUSE";


    message.textContent =
        "Collect food and beat your best score!";


    drawGame();

    startTimer();
}



/* =========================
   GAME SPEED
========================= */

function startTimer() {

    clearInterval(gameTimer);


    const speed =
        Math.max(
            60,
            145 - (level - 1) * 10
        );


    speedDisplay.textContent =
        (145 / speed).toFixed(1) + "x";


    gameTimer =
        setInterval(
            updateGame,
            speed
        );
}



/* =========================
   DRAW GAME
========================= */

function drawGame() {

    const cells =
        document.querySelectorAll(".cell");


    cells.forEach(
        cell =>
            cell.className = "cell"
    );


    /* Draw snake */

    snake.forEach(
        (part, index) => {

            const position =
                part.y * boardSize +
                part.x;


            cells[position]
                .classList
                .add("snake");


            if (index === 0) {

                cells[position]
                    .classList
                    .add("head");

            }

        }
    );


    /* Draw food */

    const foodPosition =
        food.y * boardSize +
        food.x;


    cells[foodPosition]
        .classList
        .add("food");


    /* Draw bonus */

    if (bonusFood) {

        const bonusPosition =
            bonusFood.y * boardSize +
            bonusFood.x;


        cells[bonusPosition]
            .classList
            .add("bonus");

    }


    scoreDisplay.textContent =
        score;


    bestDisplay.textContent =
        bestScore;


    levelDisplay.textContent =
        level;


    livesDisplay.textContent =
        "❤️".repeat(lives);
}



/* =========================
   UPDATE GAME
========================= */

function updateGame() {

    if (
        !gameRunning ||
        gamePaused
    ) {

        return;
    }


    direction =
        nextDirection;


    const head = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y

    };


    /* Collision */

    if (checkCollision(head)) {

        loseLife();

        return;
    }


    snake.unshift(head);


    /* Normal food */

    if (

        head.x === food.x &&
        head.y === food.y

    ) {

        score += 10;

        food = createFood();


        /* Increase level */

        if (
            score > 0 &&
            score % 50 === 0
        ) {

            level++;

            message.textContent =
                "LEVEL UP! 🚀";

            startTimer();
        }


        /* Bonus food */

        if (
            Math.random() < 0.25
        ) {

            bonusFood =
                createFood();

        }

    }


    /* Bonus food */

    else if (

        bonusFood &&

        head.x === bonusFood.x &&

        head.y === bonusFood.y

    ) {

        score += 25;

        bonusFood = null;

        message.textContent =
            "BONUS +25! ⭐";

    }


    else {

        snake.pop();

    }


    /* Best score */

    if (
        score > bestScore
    ) {

        bestScore = score;

    }


    drawGame();
}



/* =========================
   COLLISION
========================= */

function checkCollision(head) {


    /* Wall */

    if (

        head.x < 0 ||

        head.x >= boardSize ||

        head.y < 0 ||

        head.y >= boardSize

    ) {

        return true;

    }


    /* Snake */

    for (
        let i = 1;
        i < snake.length;
        i++
    ) {

        if (

            head.x === snake[i].x &&

            head.y === snake[i].y

        ) {

            return true;

        }

    }


    return false;
}



/* =========================
   LOSE LIFE
========================= */

function loseLife() {

    lives--;


    if (lives <= 0) {

        gameOver();

        return;

    }


    snake = [

        { x: 12, y: 12 },

        { x: 11, y: 12 },

        { x: 10, y: 12 }

    ];


    direction = {
        x: 1,
        y: 0
    };


    nextDirection = {
        x: 1,
        y: 0
    };


    message.textContent =
        "Life lost! Keep going ❤️";


    drawGame();
}



/* =========================
   GAME OVER
========================= */

function gameOver() {

    clearInterval(gameTimer);


    gameRunning = false;


    message.textContent =
        "GAME OVER — Press RESTART to play again";


    drawGame();


    alert(
        "GAME OVER!\n\nYour Score: " +
        score
    );
}



/* =========================
   CHANGE DIRECTION
========================= */

function changeDirection(
    newDirection
) {

    if (!gameRunning) {

        return;

    }


    const directions = {

        up: {
            x: 0,
            y: -1
        },

        down: {
            x: 0,
            y: 1
        },

        left: {
            x: -1,
            y: 0
        },

        right: {
            x: 1,
            y: 0
        }

    };


    const newDir =
        directions[newDirection];


    /* Prevent reverse */

    if (

        newDir.x +
        direction.x === 0 &&

        newDir.y +
        direction.y === 0

    ) {

        return;

    }


    nextDirection =
        newDir;
}



/* =========================
   KEYBOARD CONTROLS
========================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "ArrowUp"
        ) {

            changeDirection("up");

        }


        if (
            event.key === "ArrowDown"
        ) {

            changeDirection("down");

        }


        if (
            event.key === "ArrowLeft"
        ) {

            changeDirection("left");

        }


        if (
            event.key === "ArrowRight"
        ) {

            changeDirection("right");

        }


        /* Space = Pause */

        if (
            event.code === "Space"
        ) {

            togglePause();

        }

    }
);



/* =========================
   MOBILE BUTTONS
========================= */

document
    .querySelectorAll(
        "[data-direction]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    changeDirection(
                        this.dataset.direction
                    );

                }
            );

        }
    );



/* =========================
   PAUSE
========================= */

function togglePause() {

    if (!gameRunning) {

        return;

    }


    gamePaused =
        !gamePaused;


    if (gamePaused) {

        pauseButton.textContent =
            "RESUME";

        message.textContent =
            "GAME PAUSED";

    }

    else {

        pauseButton.textContent =
            "PAUSE";

        message.textContent =
            "Game resumed";

    }

}


pauseButton.addEventListener(
    "click",
    togglePause
);



/* =========================
   START BUTTON
========================= */

startButton.addEventListener(
    "click",
    startGame
);



/* =========================
   INITIAL BOARD
========================= */

createBoard();

</script>

</body>
</html>
